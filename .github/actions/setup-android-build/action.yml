name: Set up Android build environment
description: Configure JDK, Android SDK/NDK and Gradle for ZDT-D APK jobs.

inputs:
  android-api-level:
    description: Android SDK platform API level.
    required: true
  build-tools-version:
    description: Android Build Tools version.
    required: true
  ndk-version:
    description: Android NDK version.
    required: true
  gradle-version:
    description: Gradle version.
    required: true
  install-ndk:
    description: Whether to install and configure the Android NDK.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Resolve Android SDK location
      shell: bash
      run: |
        set -euo pipefail
        ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        ANDROID_HOME="$ANDROID_SDK_ROOT"
        SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [[ ! -x "$SDKMANAGER" ]]; then
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
        fi
        test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found under $ANDROID_SDK_ROOT"; exit 1; }
        {
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "PATH=$(dirname "$SDKMANAGER"):$PATH"
        } >> "$GITHUB_ENV"

    - name: Cache Android SDK components
      uses: actions/cache@v6
      with:
        path: |
          /usr/local/lib/android/sdk/platform-tools
          /usr/local/lib/android/sdk/platforms/android-${{ inputs.android-api-level }}
          /usr/local/lib/android/sdk/build-tools/${{ inputs.build-tools-version }}
          /usr/local/lib/android/sdk/ndk/${{ inputs.ndk-version }}
        key: android-sdk-${{ runner.os }}-${{ inputs.android-api-level }}-${{ inputs.build-tools-version }}-${{ inputs.ndk-version }}-v1

    - name: Install required Android SDK packages
      shell: bash
      env:
        INSTALL_NDK: ${{ inputs.install-ndk }}
        ANDROID_API_LEVEL: ${{ inputs.android-api-level }}
        BUILD_TOOLS_VERSION: ${{ inputs.build-tools-version }}
        NDK_VERSION: ${{ inputs.ndk-version }}
      run: |
        set -euo pipefail
        yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

        install_sdk_package() {
          local pkg="$1"
          local attempt
          for attempt in 1 2 3 4 5; do
            echo "sdkmanager install $pkg: attempt $attempt/5"
            if "$SDKMANAGER" "$pkg"; then
              return 0
            fi
            if [[ "$pkg" == platforms\;android-37.* ]]; then
              echo "Retrying $pkg through preview/canary channel"
              if "$SDKMANAGER" --channel=3 "$pkg"; then
                return 0
              fi
            fi
            rm -rf "$ANDROID_SDK_ROOT/.temp" "$ANDROID_SDK_ROOT/.downloadIntermediates" 2>/dev/null || true
            sleep $((attempt * 8))
          done
          echo "::error::Unable to install Android SDK package: $pkg"
          return 1
        }

        install_sdk_package platform-tools
        install_sdk_package "platforms;android-${ANDROID_API_LEVEL}"
        install_sdk_package "build-tools;${BUILD_TOOLS_VERSION}"

        test -s "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API_LEVEL}/android.jar" || {
          echo "::error::Android SDK platform android-${ANDROID_API_LEVEL} is missing"
          exit 1
        }

        if [[ "$INSTALL_NDK" == "true" ]]; then
          if [[ ! -d "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" ]]; then
            install_sdk_package "ndk;${NDK_VERSION}"
          fi
          NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          test -x "$NDK_ROOT/ndk-build" || {
            echo "::error::Android NDK is missing or incomplete: $NDK_ROOT"
            exit 1
          }
          {
            echo "NDK_ROOT=$NDK_ROOT"
            echo "ANDROID_NDK_ROOT=$NDK_ROOT"
            echo "ANDROID_NDK_HOME=$NDK_ROOT"
          } >> "$GITHUB_ENV"
        fi

    - name: Set up Gradle ${{ inputs.gradle-version }}
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: ${{ inputs.gradle-version }}
        cache-read-only: false
