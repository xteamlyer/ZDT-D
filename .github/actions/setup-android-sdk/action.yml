name: Prepare Android SDK and NDK
description: Resolve Android SDK paths and reuse a preinstalled NDK or restore its cache.

inputs:
  ndk-version:
    description: Android NDK version to cache.
    required: false
    default: ''
  install-ndk:
    description: Install the requested NDK when it is not available.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Resolve Android SDK paths
      id: sdk
      shell: bash
      env:
        NDK_VERSION: ${{ inputs.ndk-version }}
      run: |
        set -euo pipefail
        ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        ANDROID_HOME="$ANDROID_SDK_ROOT"
        SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [[ ! -x "$SDKMANAGER" ]]; then
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
        fi
        test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found under $ANDROID_SDK_ROOT"; exit 1; }
        {
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "PATH=$(dirname "$SDKMANAGER"):$PATH"
        } >> "$GITHUB_ENV"
        echo "sdk_root=$ANDROID_SDK_ROOT" >> "$GITHUB_OUTPUT"
        if [[ -n "$NDK_VERSION" && -x "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/ndk-build" ]]; then
          echo "ndk_preinstalled=true" >> "$GITHUB_OUTPUT"
        else
          echo "ndk_preinstalled=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore Android NDK cache
      if: ${{ inputs.ndk-version != '' && steps.sdk.outputs.ndk_preinstalled != 'true' }}
      uses: actions/cache@v6
      with:
        path: ${{ steps.sdk.outputs.sdk_root }}/ndk/${{ inputs.ndk-version }}
        key: android-ndk-${{ runner.os }}-ubuntu-24.04-${{ inputs.ndk-version }}-v2

    - name: Install Android NDK when requested
      if: ${{ inputs.install-ndk == 'true' && inputs.ndk-version != '' && steps.sdk.outputs.ndk_preinstalled != 'true' }}
      shell: bash
      env:
        NDK_VERSION: ${{ inputs.ndk-version }}
      run: |
        set -euo pipefail
        NDK_ROOT="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
        if [[ ! -x "$NDK_ROOT/ndk-build" ]]; then
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3 4 5; do
            echo "Installing Android NDK $NDK_VERSION: attempt $attempt/5"
            if "$SDKMANAGER" "ndk;$NDK_VERSION"; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to install Android NDK $NDK_VERSION"
              exit 1
            fi
            rm -rf "$ANDROID_SDK_ROOT/.temp" "$ANDROID_SDK_ROOT/.downloadIntermediates" 2>/dev/null || true
            sleep $((attempt * 8))
          done
        fi
        test -x "$NDK_ROOT/ndk-build" || { echo "::error::Android NDK is incomplete: $NDK_ROOT"; exit 1; }
        {
          echo "NDK_ROOT=$NDK_ROOT"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT"
          echo "ANDROID_NDK_HOME=$NDK_ROOT"
        } >> "$GITHUB_ENV"
